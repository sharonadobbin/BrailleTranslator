<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Whisper Test</title>
</head>
<body>
  <h1>Whisper Browser Test</h1>
  <button id="startBtn">Start Recording</button>
  <button id="stopBtn">Stop Recording</button>
  <p id="status"></p>
  <p>Transcribed text: <span id="result"></span></p>

  <script>
    let recorder;
    let audioChunks = [];

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    startBtn.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream);
      audioChunks = [];

      recorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      recorder.start();
      status.textContent = "Recording...";
    };

    stopBtn.onclick = async () => {
      if (!recorder) return;

      recorder.onstop = async () => {
        status.textContent = "Sending audio to server...";
        const audioBlob = new Blob(audioChunks, { type: "audio/mp3" });
        const formData = new FormData();
        formData.append("audio", audioBlob, "voice.mp3");

        try {
          const res = await fetch("http://127.0.0.1:5000/api/transcribe", {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          result.textContent = data.text || data.error;
        } catch (err) {
          result.textContent = "Error sending audio: " + err;
        } finally {
          status.textContent = "";
        }
      };

      recorder.stop();
      status.textContent = "Stopping recording...";
    };
  </script>
</body>
</html>
